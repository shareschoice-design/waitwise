<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joyscroll</title>
<meta name="description" content="Jen dobré zprávy. Každé ráno nové, pak odlož telefon.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Joyscroll">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#141414,#f3f3f3);--soft:light-dark(#5c5c5c,#a8a8a8);--chip:light-dark(#f0f0f0,#262626);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;height:100dvh}
h1,h2{font-family:Fredoka,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:0;text-wrap:balance}
header{flex:none;padding:calc(10px + var(--sat)) 16px 8px;border-bottom:1px solid var(--chip);user-select:none;-webkit-user-select:none}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:560px;margin:0 auto}
.hr h1{font-size:28px}
.hr h1 span{color:#ff5a7a}
.side{display:flex;align-items:center;gap:8px}
.upd{font-size:13px;color:var(--soft);white-space:nowrap}
.inst{min-height:34px;border:0;border-radius:17px;background:#ff5a7a;color:#1d0710;font:700 14px "Nunito Sans",sans-serif;padding:0 12px;cursor:pointer}
.inst[hidden]{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:560px;margin:8px auto 0;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.chips a i{width:10px;height:10px;border-radius:50%}
.chips a.on{background:var(--ink);color:var(--bg)}
.chips a:focus-visible,button:focus-visible,.read:focus-visible{outline:3px solid #ff5a7a;outline-offset:2px}
#feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;padding-bottom:var(--sab)}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:12px 16px;display:flex}
.in{max-width:560px;width:100%;margin:0 auto;border-radius:28px;background:var(--c);color:var(--k);display:flex;flex-direction:column;overflow:hidden;position:relative}
.art{flex:1 1 44%;min-height:140px;position:relative}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.txt{flex:none;padding:6px 22px 20px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;opacity:.85}
.meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt h2{font-size:clamp(26px,6.4vw,36px)}
.txt p{margin:0;font-size:17px;max-width:46ch}
.act{display:flex;gap:10px;align-items:center;margin-top:4px}
.read{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:16px;background:var(--k);color:var(--c);text-decoration:none;font-weight:700;padding:0 14px;text-align:center;font-size:15px}
.ib{width:48px;height:48px;border-radius:16px;border:2px solid var(--k);background:transparent;color:var(--k);cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.ib svg{width:24px;height:24px}
.heart.on{background:var(--k);color:var(--c)}
.heart.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}}
.end .in{--c:var(--chip);--k:var(--ink);justify-content:center;align-items:center;text-align:center;padding:28px;gap:14px}
.end h2{font-size:34px}
.end p{margin:0;max-width:34ch;color:var(--soft)}
.btn{min-height:48px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);font:700 16px "Nunito Sans",sans-serif;padding:0 20px;cursor:pointer}
.hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:13px;opacity:.75;font-weight:700;pointer-events:none;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translate(-50%,140%);transition:transform .3s ease;background:var(--ink);color:var(--bg);border:0;border-radius:24px;min-height:48px;padding:0 20px;font:700 15px "Nunito Sans",sans-serif;box-shadow:0 8px 24px #0004;cursor:pointer;white-space:nowrap;z-index:5}
.toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:6}
.sheet[hidden]{display:none}
.sheet>div{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:24px 22px calc(24px + var(--sab));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:28px}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px}
.sheet svg{width:18px;height:18px;vertical-align:-3px}
@media(prefers-reduced-motion:reduce){.hint,.heart.pop svg{animation:none}.toast{transition:none}}
@media(min-height:820px){.txt{padding-bottom:28px}}
</style>
</head>
<body>
<header>
  <div class="hr"><h1>Joy<span>scroll</span></h1><div class="side"><div class="upd" id="upd">Načítám…</div><button class="inst" id="inst" hidden>Instalovat</button></div></div>
  <nav class="chips" id="chips">
    <a href="#vse">Vše</a>
    <a href="#priroda"><i style="background:#0e7a55"></i>Příroda</a>
    <a href="#zvirata"><i style="background:#ffb020"></i>Zvířata</a>
    <a href="#lide"><i style="background:#ff5a7a"></i>Lidé</a>
    <a href="#objevy"><i style="background:#2f4bff"></i>Objevy</a>
    <a href="#ulozene">Uložené</a>
  </nav>
</header>
<main id="feed" aria-live="polite"></main>
<button class="toast" id="toast">Nové dobré zprávy · ukázat</button>
<div class="sheet" id="sheet" hidden><div role="dialog" aria-modal="true" aria-labelledby="sh">
  <h2 id="sh">Joyscroll na plochu</h2>
  <ol id="steps"></ol>
  <button class="btn" id="shok">Rozumím</button>
</div></div>

<script>
{
const CL={priroda:{n:'Příroda',c:'#0e7a55',k:'#ffffff',a:'#ffd84d',b:'#13a06f'},zvirata:{n:'Zvířata',c:'#ffb020',k:'#1c1206',a:'#fff1cc',b:'#ff8a1f'},lide:{n:'Lidé',c:'#ff5a7a',k:'#1d0710',a:'#ffe3ea',b:'#ff86a0'},objevy:{n:'Objevy',c:'#2f4bff',k:'#ffffff',a:'#9fe8ff',b:'#5b73ff'}};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const safeUrl=u=>/^https:\/\//.test(u)?u:'#';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DATA=[],UPDATED='',fav=store.get('joy-fav',[]);
const seed=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%2147483647;return()=>(h=h*16807%2147483647)/2147483647};
function art(cl,id){const p=CL[cl],r=seed(id),j=n=>(r()-.5)*n;let g='';
if(cl==='priroda'){const sx=200+j(160),sy=95+j(30);
g=`<circle cx="${sx}" cy="${sy}" r="${58+j(16)}" fill="${p.a}"/><circle cx="${sx}" cy="${sy}" r="${84+j(10)}" fill="none" stroke="${p.a}" stroke-width="3" stroke-dasharray="4 14" opacity=".7"/>`+
`<path d="M-20 ${230+j(20)} Q ${120+j(60)} ${150+j(30)} 260 ${215+j(20)} T 440 ${200+j(20)} V320 H-20Z" fill="${p.b}"/>`+
`<path d="M-20 ${262+j(14)} Q ${90+j(50)} ${210+j(20)} 210 ${250+j(14)} T 440 ${240+j(20)} V320 H-20Z" fill="#0a5a3f"/>`+
[0,1,2].map(i=>{const x=60+i*130+j(40),y=250+j(10);return `<path d="M${x} ${y} l14 -46 l14 46Z" fill="#073d2b"/><rect x="${x+12}" y="${y}" width="4" height="10" fill="#073d2b"/>`}).join('')}
if(cl==='zvirata'){const cx=200+j(80),cy=170+j(20),rot=j(40);
g=`<circle cx="${70+j(40)}" cy="${60+j(20)}" r="${30+j(10)}" fill="${p.b}" opacity=".6"/><circle cx="${340+j(40)}" cy="${250+j(20)}" r="${40+j(10)}" fill="${p.b}" opacity=".6"/>`+
`<g transform="rotate(${rot} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy+30}" rx="62" ry="52" fill="${p.k}"/>`+
[[-70,-30,22],[-28,-68,24],[28,-68,24],[70,-30,22]].map(t=>`<ellipse cx="${cx+t[0]}" cy="${cy+t[1]}" rx="${t[2]}" ry="${t[2]*1.25}" fill="${p.k}"/>`).join('')+
`<ellipse cx="${cx-18}" cy="${cy+16}" rx="16" ry="9" fill="${p.a}" opacity=".35"/></g>`}
if(cl==='lide'){const cx=200+j(60),cy=150+j(16);
g=`<circle cx="${cx-48}" cy="${cy-14}" r="44" fill="${p.k}"/><circle cx="${cx+48}" cy="${cy-14}" r="44" fill="${p.a}"/><path d="M${cx-110} 330 Q ${cx-108} ${cy+40} ${cx-48} ${cy+40} Q ${cx+12} ${cy+40} ${cx+10} 330Z" fill="${p.k}"/><path d="M${cx-10} 330 Q ${cx-12} ${cy+40} ${cx+48} ${cy+40} Q ${cx+108} ${cy+40} ${cx+110} 330Z" fill="${p.a}"/>`+
`<path d="M${cx} ${cy-58} c -10 -22 -40 -16 -38 6 c 2 16 24 28 38 40 c 14 -12 36 -24 38 -40 c 2 -22 -28 -28 -38 -6Z" fill="${p.b}" stroke="${p.k}" stroke-width="4" transform="translate(0 ${-30+j(10)})"/>`+
Array.from({length:7},()=>`<circle cx="${r()*400}" cy="${r()*110}" r="${2+r()*4}" fill="${p.a}" opacity=".8"/>`).join('')}
if(cl==='objevy'){const cx=200+j(90),cy=150+j(30);
g=Array.from({length:26},()=>`<circle cx="${r()*400}" cy="${r()*300}" r="${.8+r()*2.2}" fill="${p.a}" opacity="${.4+r()*.6}"/>`).join('')+
`<ellipse cx="${cx}" cy="${cy}" rx="${130+j(30)}" ry="${40+j(14)}" fill="none" stroke="${p.a}" stroke-width="3" transform="rotate(${-18+j(20)} ${cx} ${cy})"/>`+
`<circle cx="${cx}" cy="${cy}" r="50" fill="${p.b}"/><path d="M${cx-50} ${cy} A50 50 0 0 0 ${cx+50} ${cy}Z" fill="#1d33c9"/><circle cx="${cx-16}" cy="${cy-18}" r="10" fill="${p.a}" opacity=".55"/>`+
`<path d="M${cx+110} ${cy-80} l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6Z" fill="${p.a}"/>`}
return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">${g}</svg>`}
const IC={heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.5 5c2.1 0 3.6 1.2 4.5 2.6C11.9 6.2 13.4 5 15.5 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z" fill="currentColor"/></svg>',
share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'};
const fmt=d=>{const x=new Date(d+'T12:00:00');return x.getDate()+'. '+(x.getMonth()+1)+'.'};
function view(){const h=location.hash.slice(1);return ['priroda','zvirata','lide','objevy','ulozene'].includes(h)?h:'vse'}
function render(){const v=view();document.querySelectorAll('#chips a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
let list=DATA.filter(s=>CL[s.c]);
if(v==='ulozene')list=list.filter(s=>fav.includes(s.id));else if(v!=='vse')list=list.filter(s=>s.c===v);
const cards=list.map((s,i)=>{const p=CL[s.c],on=fav.includes(s.id);return `<section class="card"><article class="in" style="--c:${p.c};--k:${p.k}"><div class="art">${art(s.c,s.id)}</div><div class="txt"><div class="meta"><span>${esc(p.n)}</span><span>${esc(s.src)} · ${esc(fmt(s.d))}</span></div><h2>${esc(s.t)}</h2><p>${esc(s.s)}</p><div class="act"><a class="read" href="${esc(safeUrl(s.u))}" target="_blank" rel="noopener">Číst celé</a><button class="ib share" data-id="${esc(s.id)}" aria-label="Sdílet">${IC.share}</button><button class="ib heart ${on?'on':''}" data-id="${esc(s.id)}" aria-pressed="${on}" aria-label="Uložit">${IC.heart}</button></div></div>${i===0?'<div class="hint">Táhni nahoru</div>':''}</article></section>`}).join('');
const end=v==='ulozene'&&!list.length?`<section class="card end"><div class="in"><h2>Zatím nic uloženého</h2><p>Srdíčkem si schováš zprávy, ke kterým se chceš vrátit nebo je někomu povědět.</p><button class="btn" data-go="vse">Zpět na všechny</button></div></section>`:
`<section class="card end"><div class="in"><h2>To je pro dnešek všechno dobré</h2><p>${list.length} dobrých zpráv. Teď odlož telefon a udělej někomu den o kousek lepší. Nové zprávy přibudou zítra ráno.</p><button class="btn" data-go="top">Znovu od začátku</button></div></section>`;
$('feed').innerHTML=cards+end;$('feed').scrollTop=0}

/* akce na kartách */
$('feed').addEventListener('click',async e=>{
const b=e.target.closest('.heart');if(b){const id=b.dataset.id,i=fav.indexOf(id);if(i<0)fav.push(id);else fav.splice(i,1);store.set('joy-fav',fav);b.classList.toggle('on',i<0);b.setAttribute('aria-pressed',i<0);b.classList.remove('pop');void b.offsetWidth;if(i<0){b.classList.add('pop');navigator.vibrate&&navigator.vibrate(12)}if(view()==='ulozene')render();return}
const sh=e.target.closest('.share');if(sh){const s=DATA.find(x=>x.id===sh.dataset.id);if(!s)return;const text=s.t+' – dobrá zpráva z Joyscrollu';
try{if(navigator.share){await navigator.share({title:s.t,text,url:s.u})}else{await navigator.clipboard.writeText(text+' '+s.u);toast('Odkaz zkopírován',null)}}catch(err){}return}
const g=e.target.closest('[data-go]');if(g){if(g.dataset.go==='top')$('feed').scrollTo({top:0,behavior:'smooth'});else location.hash='vse'}});
document.addEventListener('keydown',e=>{if(!$('sheet').hidden)return;const f=$('feed');if(e.key==='ArrowDown'||e.key==='j'){f.scrollBy({top:f.clientHeight,behavior:'smooth'});e.preventDefault()}if(e.key==='ArrowUp'||e.key==='k'){f.scrollBy({top:-f.clientHeight,behavior:'smooth'});e.preventDefault()}});
window.addEventListener('hashchange',render);

/* toast */
let tt,tAct=null;
function toast(msg,act){const t=$('toast');t.textContent=msg;tAct=act;t.classList.add('show');clearTimeout(tt);if(!act)tt=setTimeout(()=>t.classList.remove('show'),2200)}
$('toast').addEventListener('click',()=>{$('toast').classList.remove('show');tAct&&tAct()});

/* načtení zpráv; při návratu do appky zkontroluje, jestli nepřibyly nové */
function apply(j){DATA=(j.items||[]).slice().sort((a,b)=>String(b.d).localeCompare(String(a.d)));UPDATED=j.updated||'';
const u=new Date(UPDATED);$('upd').textContent=isNaN(u)?'':'Aktualizováno '+u.getDate()+'. '+(u.getMonth()+1)+'.';render()}
const get=()=>fetch('stories.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()});
get().then(apply).catch(()=>{$('upd').textContent='';$('feed').innerHTML='<section class="card end"><div class="in"><h2>Dobré zprávy se nenačetly</h2><p>Zkontroluj připojení a zkus to znovu. Svět mezitím dobrý zůstává.</p><button class="btn" onclick="location.reload()">Zkusit znovu</button></div></section>'});
let lastCheck=Date.now();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||Date.now()-lastCheck<60000)return;lastCheck=Date.now();
get().then(j=>{if(j.updated&&j.updated!==UPDATED){const top=$('feed').scrollTop<20;if(top)apply(j);else toast('Nové dobré zprávy · ukázat',()=>apply(j))}}).catch(()=>{})});

/* instalace na plochu */
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!standalone)$('inst').hidden=false});
window.addEventListener('appinstalled',()=>{$('inst').hidden=true;deferred=null});
if(!standalone&&ios)$('inst').hidden=false;
$('inst').addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;return}
$('steps').innerHTML=ios?`<li>Dole klepni na <b>Sdílet</b> ${IC.share}</li><li>Vyber <b>Přidat na plochu</b></li><li>Potvrď <b>Přidat</b>. Joyscroll pak spustíš z plochy jako appku.</li>`:
`<li>V prohlížeči otevři menu ${IC.more}</li><li>Vyber <b>Nainstalovat aplikaci</b> nebo <b>Přidat na plochu</b></li><li>Joyscroll pak spustíš z plochy jako appku.</li>`;
$('sheet').hidden=false;$('shok').focus()});
$('shok').addEventListener('click',()=>{$('sheet').hidden=true});
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').hidden=true});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
